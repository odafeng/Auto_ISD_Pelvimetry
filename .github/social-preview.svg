  </g>
  <text x="88" y="566" fill="#6E93A7" font-family="Arial, Helvetica, sans-serif" font-size="18">10.1007/s11548-026-03606-2 · odafeng/auto-isd-pelvimetry</text>
  <g transform="translate(760 154)" font-family="Arial, Helvetica, sans-serif">
    <rect width="430" height="330" rx="28" fill="#0C2739" stroke="#2DD4BF" stroke-opacity="0.7"/>
    <g transform="translate(50 72)">
      <circle cx="38" cy="54" r="38" fill="#163A4D" stroke="#8FB2C3"/><ellipse cx="38" cy="54" rx="18" ry="25" fill="none" stroke="#5EEAD4"/>
      <text x="38" y="122" text-anchor="middle" fill="#C6D5DF" font-size="17">CT</text>
      <line x1="88" y1="54" x2="142" y2="54" stroke="#2DD4BF" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="158" y="16" width="76" height="76" rx="16" fill="#163A4D" stroke="#8FB2C3"/>
      <path d="M174 68C186 32 206 30 218 68" fill="none" stroke="#5EEAD4" stroke-width="5"/>
