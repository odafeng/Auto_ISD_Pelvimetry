  <text x="88" y="272" fill="#C6D5DF" font-family="Arial, Helvetica, sans-serif" font-size="27">and mid-pelvic workspace quantification</text>
  <text x="88" y="318" fill="#8FB2C3" font-family="Arial, Helvetica, sans-serif" font-size="22">Rectal cancer · segmentation · reproducible geometry</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
    <rect x="88" y="462" width="190" height="48" rx="24" fill="#123E50" stroke="#2DD4BF"/><text x="183" y="493" text-anchor="middle" fill="#E6FFFB">IJCARS 2026</text>
