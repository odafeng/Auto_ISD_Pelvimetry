<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Auto-ISD social preview</title>
  <desc id="desc">Peer-reviewed automated CT pelvimetry pipeline with interactive demo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071A2B"/><stop offset="1" stop-color="#12364B"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5EEAD4" stroke-opacity="0.05"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2DD4BF"/></marker>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/><rect width="1280" height="640" rx="28" fill="url(#grid)"/>
  <rect x="54" y="62" width="8" height="516" rx="4" fill="#2DD4BF"/>
  <text x="88" y="94" fill="#5EEAD4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">PEER-REVIEWED RESEARCH · MEDICAL IMAGING</text>
  <text x="86" y="188" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="750">Auto-ISD</text>
